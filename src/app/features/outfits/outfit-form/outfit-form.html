<div class="page-header">
  <h1>{{ outfitId() ? 'Edit outfit' : 'New outfit' }}</h1>
</div>

@if (loading()) {
  <p>Loading…</p>
}

<form class="app-form" [formGroup]="form" (ngSubmit)="submit()">
  <label class="field">
    Brand
    <select formControlName="brandId">
      <option value="" disabled>Select a brand</option>
      @for (brand of brands(); track brand.id) {
        <option [value]="brand.id">{{ brand.name }}</option>
      }
    </select>
  </label>

  <label class="field">
    Name
    <input type="text" formControlName="name" />
  </label>

  <label class="field">
    Slug
    <input type="text" formControlName="slug" />
  </label>

  <label class="field">
    Category
    <input type="text" formControlName="category" />
  </label>

  <label class="field">
    Price
    <input type="number" formControlName="price" min="0" step="0.01" />
  </label>

  <label class="field">
    Description
    <textarea formControlName="description" rows="3"></textarea>
  </label>

  <label class="field">
    Image URL
    <input type="text" formControlName="imageUrl" />
  </label>

  <label class="field">
    Tags (comma-separated)
    <input type="text" formControlName="tagsText" />
  </label>

  <label class="field">
    Season
    <select formControlName="season">
      @for (season of seasons; track season) {
        <option [value]="season">{{ season }}</option>
      }
    </select>
  </label>

  <label class="field">
    Status
    <select formControlName="status">
      @for (status of statuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn--primary" [disabled]="form.invalid || saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
    <a routerLink="/outfits" class="btn btn--ghost">Cancel</a>
  </div>
</form>
