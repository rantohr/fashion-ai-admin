<div class="page-header">
  <h1>{{ articleId() ? 'Edit article' : 'New article' }}</h1>
</div>

@if (loading()) {
  <p>Loading…</p>
}

<form class="app-form app-form--wide" [formGroup]="form" (ngSubmit)="submit()">
  <label class="field">
    Outfit
    <select formControlName="outfitId">
      <option value="" disabled>Select an outfit</option>
      @for (outfit of outfits(); track outfit.id) {
        <option [value]="outfit.id">{{ outfit.name }}</option>
      }
    </select>
  </label>

  <label class="field">
    Title
    <input type="text" formControlName="title" />
  </label>

  <label class="field">
    Slug
    <input type="text" formControlName="slug" />
  </label>

  <label class="field">
    Excerpt
    <textarea formControlName="excerpt" rows="2"></textarea>
  </label>

  <label class="field">
    Content (markdown)
    <textarea formControlName="content" rows="8"></textarea>
  </label>

  <label class="field">
    Status
    <select formControlName="status">
      @for (status of statuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn--primary" [disabled]="form.invalid || saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
    <a routerLink="/articles" class="btn btn--ghost">Cancel</a>
  </div>
</form>
