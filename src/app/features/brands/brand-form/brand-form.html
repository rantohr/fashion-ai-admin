<div class="page-header">
  <h1>{{ brandId() ? 'Edit brand' : 'New brand' }}</h1>
</div>

@if (loading()) {
  <p>Loading…</p>
}

<form class="app-form" [formGroup]="form" (ngSubmit)="submit()">
  <label class="field">
    Name
    <input type="text" formControlName="name" />
  </label>

  <label class="field">
    Slug
    <input type="text" formControlName="slug" />
  </label>

  <label class="field">
    Description
    <textarea formControlName="description" rows="3"></textarea>
  </label>

  <label class="field">
    Logo URL
    <input type="text" formControlName="logoUrl" />
  </label>

  <label class="field">
    Website
    <input type="text" formControlName="website" />
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn--primary" [disabled]="form.invalid || saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
    <a routerLink="/brands" class="btn btn--ghost">Cancel</a>
  </div>
</form>
