<div class="shell">
  <aside class="shell__nav">
    <p class="shell__brand">Fashion AI Admin</p>
    <nav>
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active">{{ link.label }}</a>
      }
    </nav>
    <div class="shell__user">
      @if (auth.currentUser(); as user) {
        <p class="shell__user-name">{{ user.name }}</p>
        <p class="shell__user-email">{{ user.email }}</p>
      }
      <button type="button" class="btn btn--ghost btn--sm" (click)="logout()">Log out</button>
    </div>
  </aside>
  <main class="shell__content">
    <router-outlet />
  </main>
</div>
