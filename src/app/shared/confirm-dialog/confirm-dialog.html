<div class="overlay">
  <div class="dialog" role="alertdialog" aria-modal="true">
    <p>{{ message() }}</p>
    <div class="actions">
      <button type="button" class="btn btn--ghost" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="btn btn--danger-solid" (click)="confirmed.emit()">Delete</button>
    </div>
  </div>
</div>
